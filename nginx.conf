
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"$proxy_host"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    server {
        listen 80;
        server_name dspaceangularsteve.azurewebsites.net;
        root /usr/share/nginx/html;
        index index.html;
        #location / {
        #    try_files $uri$args $uri$args/ /index.html;
        #}

        # Serve static files (Angular SSR)
        location /assets/ {
            root /usr/share/nginx/html;  # Modify if your static files are located elsewhere
            expires 1y;
            add_header Cache-Control "public";
        }

        # Pass requests to Angular Universal SSR server
        location / {
            proxy_pass https://angular_universal_server:4000; # Use the service name defined in docker-compose.yml
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Log outbound proxy calls
        access_log /var/log/nginx/angular_universal_access.log main;
    }

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
