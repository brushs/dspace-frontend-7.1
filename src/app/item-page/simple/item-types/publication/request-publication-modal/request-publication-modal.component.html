<div class="modal-header">
  <h4 class="modal-title">{{ 'item.page.request' | translate }}</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group">
    <label for="request-item-title">Title</label>
    <input id="request-item-title" class="form-control" [value]="itemTitle" readonly>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <div class="form-group">
        <label for="requester-language">Language</label>
        <select id="requester-language" class="form-control" formControlName="language">
          <option value="en">English</option>
          <option value="fr">French</option>
        </select>
      </div>
      <label for="requester-email">Email</label>
      <input id="requester-email" class="form-control" formControlName="email" type="email">
      <div class="invalid-feedback d-block" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email address.
      </div>
    </div>
    <div class="alert alert-success" *ngIf="submitSuccess">
      Request submitted.
    </div>
    <div class="alert alert-danger" *ngIf="submitError">
      Request failed. Please try again.
    </div>
    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-outline-secondary mr-2" (click)="activeModal.dismiss()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="submitting">
        {{ submitting ? 'Submitting...' : 'Submit' }}
      </button>
    </div>
  </form>
</div>
